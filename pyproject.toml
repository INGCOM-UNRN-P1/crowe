[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crowe"
version = "0.1.0"
description = "Linter de portabilidad multi-arquitectura (x86_64, ARM, RISC-V, endianness) en C"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
]

[project.scripts]
crowe = "crowe.cli:app"

[project.entry-points."ripley.plugins"]
portability = "crowe.plugins.ripley_plugin:CrowePlugin"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
